name: Run Main and Bot

on:
  schedule:
    - cron: '59 16 * * *'
      timezone: Africa/Lagos
  push:
  workflow_dispatch:

jobs:
  run-both-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run bot.py and main.py concurrently
        env: ${{ vars }}
        run: |
          python bot.py &
          BOT_PID=$!
          echo "bot.py started in background with PID: $BOT_PID"

          python main.py

          echo "main.py exited. Stopping bot.py..."
          kill $BOT_PID || true
